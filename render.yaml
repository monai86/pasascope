# Render Blueprint Specification for the public PasaScope API
# Docs: https://render.com/docs/blueprint-spec
#
# Public sign-up, open review gates, hosted transcription. The free plan has
# 512 MB, so the image (deploy/render/Dockerfile) leaves out on-device Whisper.
# Step-by-step setup: docs/PUBLIC_DEPLOYMENT.md

services:
  - type: web
    name: pasascope-public-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: deploy/render/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: "8000"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: PASASCOPE_APP_ENV
        value: staging
      # Mock mode keeps the in-process job queue and creates tables at startup.
      - key: PASASCOPE_MOCK_MODE
        value: "true"
      - key: PASASCOPE_AUTH_MODE
        value: supabase
      - key: PASASCOPE_PUBLIC_SIGNUP
        value: "true"
      - key: PASASCOPE_REVIEW_GATES
        value: open
      - key: PASASCOPE_SUPABASE_REQUIRE_MFA
        value: "false"
      - key: PASASCOPE_SUPABASE_REQUIRE_INVITATION
        value: "false"
      - key: PASASCOPE_SUPABASE_JWT_VERIFICATION_MODE
        value: jwks_url
      - key: PASASCOPE_SUPABASE_JWT_JWKS_URL
        value: https://hxkuoshpgdbwpseikrbf.supabase.co/auth/v1/.well-known/jwks.json
      - key: PASASCOPE_SUPABASE_JWT_JWKS_CACHE_TTL_SECONDS
        value: "300"
      - key: PASASCOPE_SUPABASE_JWT_ISSUER
        value: https://hxkuoshpgdbwpseikrbf.supabase.co/auth/v1
      - key: PASASCOPE_SUPABASE_JWT_AUDIENCE
        value: authenticated
      - key: PASASCOPE_REPOSITORY_MODE
        value: sql
      # Recordings are written to local disk and copied to the private bucket,
      # because the disk is wiped whenever the service restarts.
      - key: PASASCOPE_STORAGE_MODE
        value: local_private
      - key: PASASCOPE_AUDIO_BACKUP_MODE
        value: supabase
      - key: PASASCOPE_SUPABASE_STORAGE_URL
        value: https://hxkuoshpgdbwpseikrbf.supabase.co
      - key: PASASCOPE_SUPABASE_STORAGE_BUCKET
        value: audio-recordings
      # Hosted transcription sends recordings to an external service.
      - key: PASASCOPE_ASR_HOSTED_ENABLED
        value: "true"
      - key: PASASCOPE_ASR_HOSTED_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: PASASCOPE_ASR_HOSTED_MODEL
        value: whisper-large-v3
      - key: PASASCOPE_ASR_LANGUAGE_STRATEGY
        value: thai
      - key: PASASCOPE_CORS_ALLOWED_ORIGINS
        sync: false
      - key: PASASCOPE_DATABASE_URL
        sync: false
      - key: PASASCOPE_SUPABASE_STORAGE_SERVICE_ROLE_KEY
        sync: false
      - key: PASASCOPE_ASR_HOSTED_API_KEY
        sync: false
