# Render Blueprint Specification for the PasaScope API
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: pasascope-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: "8000"
      - key: PYTHONPATH
        value: ".:apps/api:src"
      - key: PASASCOPE_APP_ENV
        value: staging
      - key: PASASCOPE_MOCK_MODE
        value: "true"
      - key: PASASCOPE_AUTH_MODE
        value: supabase
      - key: PASASCOPE_REPOSITORY_MODE
        value: sql
      - key: PASASCOPE_STORAGE_MODE
        value: supabase_private
      - key: PASASCOPE_SUPABASE_STORAGE_URL
        value: https://lliodfzujsmapwmpqmjb.supabase.co
      - key: PASASCOPE_SUPABASE_STORAGE_BUCKET
        value: audio-recordings
      - key: PASASCOPE_SUPABASE_STORAGE_TUS_ENDPOINT
        value: https://lliodfzujsmapwmpqmjb.supabase.co/storage/v1/upload/resumable
      - key: PASASCOPE_SUPABASE_JWT_VERIFICATION_MODE
        value: jwks_url
      - key: PASASCOPE_SUPABASE_JWT_JWKS_URL
        value: https://lliodfzujsmapwmpqmjb.supabase.co/auth/v1/.well-known/jwks.json
      - key: PASASCOPE_SUPABASE_JWT_JWKS_CACHE_TTL_SECONDS
        value: "300"
      - key: PASASCOPE_SUPABASE_JWT_ISSUER
        value: https://lliodfzujsmapwmpqmjb.supabase.co/auth/v1
      - key: PASASCOPE_SUPABASE_JWT_AUDIENCE
        value: authenticated
      - key: PASASCOPE_SUPABASE_REQUIRE_MFA
        value: "false"
      - key: PASASCOPE_SUPABASE_REQUIRE_INVITATION
        value: "false"
      - key: PASASCOPE_CORS_ALLOWED_ORIGINS
        sync: false
      - key: PASASCOPE_DATABASE_URL
        sync: false
      - key: PASASCOPE_SUPABASE_STORAGE_SERVICE_ROLE_KEY
        sync: false
