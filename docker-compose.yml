services:
  api:
    image: python:3.12-slim
    working_dir: /workspace/apps/api
    volumes:
      - .:/workspace
    command: sh -c "pip install -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/workspace/apps/api:/workspace
      - THERAPIST_APP_V2_DEBUG_FEATURE_OVERRIDE=false
      - PASASCOPE_STORAGE_MODE=supabase_private
      - PASASCOPE_SUPABASE_STORAGE_URL=${PASASCOPE_SUPABASE_STORAGE_URL:-${LINGUALENS_SUPABASE_STORAGE_URL:-}}
      - PASASCOPE_SUPABASE_STORAGE_SERVICE_ROLE_KEY=${PASASCOPE_SUPABASE_STORAGE_SERVICE_ROLE_KEY:-${LINGUALENS_SUPABASE_STORAGE_SERVICE_ROLE_KEY:-}}
      - PASASCOPE_SUPABASE_STORAGE_BUCKET=${PASASCOPE_SUPABASE_STORAGE_BUCKET:-${LINGUALENS_SUPABASE_STORAGE_BUCKET:-}}
      - PASASCOPE_SUPABASE_STORAGE_TUS_ENDPOINT=${PASASCOPE_SUPABASE_STORAGE_TUS_ENDPOINT:-${LINGUALENS_SUPABASE_STORAGE_TUS_ENDPOINT:-}}
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    image: python:3.11-slim
    working_dir: /workspace/apps/api
    volumes:
      - .:/workspace
    # Only useful with the Redis queue: the default memory queue is drained inside
    # the api service itself.
    profiles: ["redis-worker"]
    command: sh -c "pip install -r ../../requirements.txt -r requirements.txt && python -m app.tasks.worker"
    environment:
      - PYTHONPATH=/workspace/apps/api:/workspace
      - THERAPIST_APP_V2_DEBUG_FEATURE_OVERRIDE=false
      - PASASCOPE_JOB_QUEUE_MODE=redis
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis

  frontend:
    image: node:22-slim
    working_dir: /workspace/apps/pasascope-app
    volumes:
      - .:/workspace
    command: sh -c "npm ci && npm run dev -- --hostname 0.0.0.0"
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000/api/v1
    depends_on:
      - api

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=therapist
      - POSTGRES_PASSWORD=therapist
      - POSTGRES_DB=therapist_app_v2
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U therapist -d therapist_app_v2"]
      interval: 2s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
