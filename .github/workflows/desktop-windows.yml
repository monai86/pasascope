name: Desktop Windows installer

# Builds PasaScope-<version>-windows-x64-setup.exe on Windows with
# scripts/build_windows.py (smoke test included). On a published release the
# installer and its .sha256 are attached to that release, where the in-app
# updater on Windows finds them; other runs keep them as a workflow artifact.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Attach the installer to this existing release (e.g. v1.7.5); leave empty to keep it as an artifact only"
        required: false
        default: ""
  release:
    types: [published]
  push:
    branches:
      - feat/desktop-qt
    paths:
      - scripts/build_windows.py
      - scripts/desktop_bundle/**
      - .github/workflows/desktop-windows.yml

permissions:
  contents: write

concurrency:
  group: desktop-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag || github.ref }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: The release tag matches the app version
        if: github.event_name == 'release' || inputs.release_tag != ''
        shell: python
        run: |
          import tomllib
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          tag = "${{ github.event.release.tag_name || inputs.release_tag }}"
          assert tag == f"v{version}", f"tag {tag} but pyproject.toml says {version}"

      - name: Install Inno Setup when missing
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Build and smoke-test the installer
        run: python scripts/build_windows.py

      - name: Install it and open PasaScope as a user would
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\PasaScope-*-windows-x64-setup.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/TASKS=desktopicon" -Wait
          $app = Join-Path $env:LOCALAPPDATA "Programs\PasaScope"
          if (-not (Test-Path "$app\app\PasaScope.pyw")) { throw "PasaScope was not installed in $app" }
          $shortcut = Join-Path ([Environment]::GetFolderPath("Programs")) "PasaScope.lnk"
          if (-not (Test-Path $shortcut)) { throw "No Start menu shortcut at $shortcut" }
          # The same command the shortcut runs; the window must still be open after 30 seconds.
          $process = Start-Process "$app\python\pythonw.exe" -ArgumentList "-s", "`"$app\app\PasaScope.pyw`"" -WorkingDirectory "$app\app" -PassThru
          Start-Sleep -Seconds 30
          $log = Join-Path $env:LOCALAPPDATA "PasaScope\Logs\desktop.log"
          if (Test-Path $log) { Get-Content $log -Tail 40 }
          if ($process.HasExited) { throw "PasaScope exited with code $($process.ExitCode)" }
          Stop-Process -Id $process.Id -Force
          if (-not (Test-Path (Join-Path $env:APPDATA "PasaScope"))) { throw "No data folder in %APPDATA%\PasaScope" }
          Start-Process "$app\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES" -Wait
          # The uninstaller hands over to a copy of itself in %TEMP% and returns at once: wait for that copy.
          for ($i = 0; $i -lt 60 -and (Test-Path "$app\app"); $i++) { Start-Sleep -Seconds 2 }
          if (Test-Path "$app\app") { Get-ChildItem -Recurse "$app" | Select-Object -First 20 FullName; throw "Uninstall left the program files" }
          if (-not (Test-Path (Join-Path $env:APPDATA "PasaScope"))) { throw "Uninstall removed the data folder" }
          Write-Output "Installed, opened for 30 s, uninstalled; the data folder was kept."

      - name: Keep the installer as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: PasaScope-windows-installer
          path: |
            dist/PasaScope-*-windows-x64-setup.exe
            dist/PasaScope-*-windows-x64-setup.exe.sha256
          retention-days: 14

      - name: Attach the installer to the release
        if: github.event_name == 'release' || inputs.release_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name || inputs.release_tag }}" \
            dist/PasaScope-*-windows-x64-setup.exe dist/PasaScope-*-windows-x64-setup.exe.sha256 \
            --clobber --repo "${{ github.repository }}"
